<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="description" content="배우 안지환 아카이브 사이트">
    <meta name="keywords" content="안지환">
    <meta property="og:image" content="https://blog.kakaocdn.net/dn/bpb0mG/btsMKDW3how/eF5FV41D8WPY4JtRAzrfrk/img.jpg">
    <meta property="og:title" content="AHNJEEHWANY">
    <meta property="og:description" content="배우 안지환 아카이브 사이트 - 오렌지로도 연습할 수 있대">
	<meta name="theme-color" content="#fff3dc">
	<title>오렌지로 연습할 수 있대!</title>
    <!-- 파비콘 -->
    <link rel="apple-touch-icon" sizes="180x180" href="../img/favicon_io_new/apple-icon-180x180.png">
    <link rel="icon" type="image/x-icon" href="../img/favicon_io_new/ms-icon-310x310.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon_io_new/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../img/favicon_io_new/favicon-16x16.png">
	<link rel="stylesheet" href="orange.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="danger"></div>

  <header id="hud">
  	<a href="https://www.jeehwany.com/games" class="game-nav-btn" aria-label="게임 목록으로 돌아가기" title="게임 목록">
	  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
	    <rect x="3" y="3" width="7" height="7" rx="1.5"/>
	    <rect x="14" y="3" width="7" height="7" rx="1.5"/>
	    <rect x="3" y="14" width="7" height="7" rx="1.5"/>
	    <rect x="14" y="14" width="7" height="7" rx="1.5"/>
	  </svg>
	</a>
    <div class="title"><span class="t">오렌지로 연습할 수 있대</span></div>
    <div class="stat"><span class="label">껍질 길이</span><span id="len" class="value">0.0 cm</span></div>
    <div class="stat"><span class="label">벗긴 면적</span><span id="area" class="value">0%</span></div>
  </header>

  <button id="snd" class="icon-btn" aria-label="소리 켜기/끄기">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 9.5h3.6L12 6v12l-4.4-3.5H4z" fill="currentColor"/><g class="on" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15.2 9.2a4 4 0 0 1 0 5.6"/><path d="M17.6 6.8a7.4 7.4 0 0 1 0 10.4"/></g><path class="offx" d="M15.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

  <div id="fing" aria-hidden="true">👆</div>
  
  <section id="start" class="overlay">
    <div class="card">
      <svg class="mascot" viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="112" rx="34" ry="5" fill="#d9a766" opacity=".35"/>
        <circle cx="60" cy="66" r="44" fill="#ff9a24"/>
        <circle cx="46" cy="50" r="12" fill="#ffc470" opacity=".55"/>
        <rect x="56" y="14" width="8" height="14" rx="3" fill="#4caf3a"/>
        <circle cx="48" cy="70" r="4" fill="#6b3510"/><circle cx="72" cy="70" r="4" fill="#6b3510"/>
        <path d="M51 82 Q60 90 69 82" stroke="#6b3510" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </svg>
      <h1>오렌지 껍질 까기</h1>
      <p class="lead">내가 어디서 봤는데<br>오렌지로도 연습할 수 있대!</p>
      <button id="go" class="btn">시작하기</button>
      <!-- <p id="nogl">이 브라우저에서는 3D(WebGL)를 쓸 수 없어요.</p> -->
      <p class="note">드래그 = 오렌지 돌리기 · 껍질 끝을 잡고 당기기 = 벗기기</p>
    </div>
  </section>

  <section id="result" class="overlay hidden">
    <div class="res">
      <div id="bubble" class="bubble"><span id="b-text"></span></div>
      <div id="chrbox"><svg id="chr" viewBox="0 0 240 220" aria-hidden="true">
  <g id="chr-in">
  <ellipse cx="120" cy="208" rx="60" ry="6" fill="#d9a766" opacity=".35"/>
  <circle cx="120" cy="128" r="76" fill="#ff9a24"/>
  <circle cx="90" cy="104" r="17" fill="#ffc470" opacity=".55"/>
  <g transform="rotate(-12 120 128)">
    <path d="M44 84 Q22 76 30 66 Q40 62 52 70Z" fill="#c4242d"/>
    <path d="M52 92 Q42 52 76 36 Q120 22 164 36 Q198 52 188 92 Q154 100 120 101 Q86 100 52 92Z" fill="#e0303a"/>
    <path d="M70 52 Q96 36 126 38 Q96 44 80 66Z" fill="#f0525a" opacity=".55"/>
    <path d="M104 100 Q120 112 136 100Z" fill="#e0303a"/>
  </g>
  <ellipse cx="70" cy="148" rx="12" ry="7.5" fill="#ff5a3a" opacity=".42"/><ellipse cx="170" cy="148" rx="12" ry="7.5" fill="#ff5a3a" opacity=".42"/>
  <g fill="#bd5a0c" opacity=".75"><circle cx="64" cy="143" r="2"/><circle cx="73" cy="140" r="2"/><circle cx="82" cy="144" r="2"/><circle cx="68" cy="152" r="2"/><circle cx="78" cy="153" r="2"/><circle cx="176" cy="143" r="2"/><circle cx="167" cy="140" r="2"/><circle cx="158" cy="144" r="2"/><circle cx="172" cy="152" r="2"/><circle cx="162" cy="153" r="2"/></g>
  <g fill="none" stroke="#6b3510" stroke-linecap="round" stroke-width="4.2"><path d="M76 114 Q92 112 106 121"/><path d="M134 121 Q148 112 164 114"/></g>
  <circle cx="92" cy="132" r="7.5" fill="#6b3510"/><circle cx="148" cy="132" r="7.5" fill="#6b3510"/>
  <circle cx="94.4" cy="129.2" r="2.4" fill="#fff"/><circle cx="150.4" cy="129.2" r="2.4" fill="#fff"/>
  <g class="ex ex-win"><g class="mouth">
    <path d="M102 158 Q120 150 138 158 Q136 182 120 182 Q104 182 102 158Z" fill="#6b3510"/>
    <path d="M108 172 Q120 166 132 172 Q128 181 120 181 Q112 181 108 172Z" fill="#e8756c"/>
  </g></g>
  <g class="ex ex-lose"><g class="mouth">
    <path d="M100 160 Q119 150 140 156 Q140 182 120 182 Q102 182 100 160Z" fill="#6b3510"/>
    <path d="M108 173 Q121 166 134 171 Q130 181 120 181 Q111 181 108 173Z" fill="#e8756c"/>
    <path d="M106 158 Q120 154 134 156 L134 161 Q120 159 106 163Z" fill="#fff"/>
  </g></g>
  </g>
</svg></div>
      <p id="r-note" class="note">먹으라고 준 오렌지가 아닙니다</p>
      <p id="r-len" class="big">오렌지를 0% 깠어요</p>
      <p id="r-cm" class="cmline">깐 껍질 길이 0.0 cm</p>
      
      <button id="retry" class="btn">다시 하기</button>
    </div>
  </section>
</div>

<script src="three.min.js"></script>
<script src="sim.js"></script>
<script src="orange.js"></script>
</body>
</html>
