<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff3dc">
<title>오렌지 껍질 까기 3D</title>
<link rel="stylesheet" href="orange.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="danger"></div>

  <header id="hud">
    <div class="stat"><span class="label">껍질 길이</span><span id="len" class="value">0.0 cm</span></div>
    <div class="stat"><span class="label">벗긴 면적</span><span id="area" class="value small">0%</span></div>
    <div class="stat best"><span class="label">최고 기록</span><span id="best" class="value small">0.0 cm</span></div>
    <button id="snd" class="icon-btn" aria-label="소리 켜기/끄기">🔊</button>
  </header>

  <div id="fing" aria-hidden="true">👆</div>
  <div id="hint"><p id="tip"></p></div>

  <section id="start" class="overlay">
    <div class="card">
      <svg class="mascot" viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="112" rx="34" ry="5" fill="#d9a766" opacity=".35"/>
        <circle cx="60" cy="66" r="44" fill="#ff9a24"/>
        <circle cx="46" cy="50" r="12" fill="#ffc470" opacity=".55"/>
        <rect x="56" y="14" width="8" height="14" rx="3" fill="#4caf3a"/>
        <circle cx="48" cy="70" r="4" fill="#6b3510"/><circle cx="72" cy="70" r="4" fill="#6b3510"/>
        <path d="M51 82 Q60 90 69 82" stroke="#6b3510" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </svg>
      <h1>오렌지 껍질 까기</h1>
      <p class="lead">오렌지를 마음대로 돌려 보고,<br>껍질 끝을 잡아 당겨 끊기지 않게 길게 벗겨요.</p>
      <button id="go" class="btn">시작하기</button>
      <p id="nogl">이 브라우저에서는 3D(WebGL)를 쓸 수 없어요.</p>
      <p class="note">빈 곳을 드래그 = 오렌지 돌리기 · 껍질 끝을 잡고 당기기 = 벗기기</p>
    </div>
  </section>

  <section id="result" class="overlay hidden">
    <div class="card">
      <span id="badge" class="badge hidden">NEW BEST!</span>
      <h2 id="r-title">GAME OVER</h2>
      <p id="r-len" class="big">0.0 cm</p>
      <p id="r-best" class="label">최고 기록 0.0 cm</p>
      <p id="r-reason" class="reason"></p>
      <button id="retry" class="btn">다시 하기</button>
    </div>
  </section>
</div>

<script src="three.min.js"></script>
<script src="sim.js"></script>
<script src="orange.js"></script>
</body>
</html>
