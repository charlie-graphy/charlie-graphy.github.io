<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
	<meta name="description" content="배우 안지환 아카이브 사이트">
    <meta name="keywords" content="안지환">
    <meta property="og:image" content="https://blog.kakaocdn.net/dn/bpb0mG/btsMKDW3how/eF5FV41D8WPY4JtRAzrfrk/img.jpg">
    <meta property="og:title" content="AHNJEEHWANY">
    <meta property="og:description" content="배우 안지환 아카이브 사이트 - 별들의 밤">
	<meta name="theme-color" content="#111B38">
	<title>별들의 밤</title>
    <!-- 파비콘 -->
    <link rel="apple-touch-icon" sizes="180x180" href="../img/favicon_io_new/apple-icon-180x180.png">
    <link rel="icon" type="image/x-icon" href="../img/favicon_io_new/ms-icon-310x310.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon_io_new/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../img/favicon_io_new/favicon-16x16.png">
	<link rel="stylesheet" href="star.css">
</head>
<body class="s-ready">
<main id="game">
  <!-- 레이어: 1 밤하늘+별(CSS·Canvas) → 2 원경 마을·언덕·호수(SVG) → 3 수면 반짝임 → 4 테라스·랜턴(SVG) → 5 캐릭터 → 6 별똥별 Canvas → UI -->
  <canvas id="bg"></canvas>
  <div id="bgimg" hidden></div>
  <div id="far" aria-hidden="true"></div>
  <canvas id="lk"></canvas>
  <div id="terrace" aria-hidden="true"></div>

  <!-- assets/character.webp 가 있으면 그 이미지를, 없거나 로드 실패 시 아래 SVG 캐릭터를 표시합니다 -->
  <div id="char" aria-hidden="true">
    <img id="charImg" alt="" hidden>
    <svg id="charSvg" viewBox="0 0 360 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="plaid" width="26" height="26" patternUnits="userSpaceOnUse">
          <rect width="26" height="26" fill="#857a82"/>
          <rect width="7" height="26" fill="#6d5f86" opacity=".55"/><rect width="26" height="6" fill="#5a4f66" opacity=".5"/>
          <path d="M13 0v26M0 15h26" stroke="#b3a8ad" stroke-width="1" opacity=".5"/>
          <path d="M2 3l3 7M17 1l3 8M9 14l3 8M21 16l3 7" stroke="#6f6570" stroke-width="1.600" stroke-linecap="round" opacity=".7"/>
        </pattern>
      </defs>
      <g id="charBody">
        <!-- 앉아 있는 돌담 -->
        <rect x="14" y="298" width="332" height="102" rx="10" fill="#586080" stroke="#3c4363" stroke-width="3"/>
        <rect x="8" y="288" width="344" height="18" rx="9" fill="#7b83a8" stroke="#3c4363" stroke-width="3"/>
        <path d="M14 346h332M100 306v40M200 346v54M290 306v40" stroke="#464d6b" stroke-width="2.500"/>
        <!-- 갈색 바지 · 신발 -->
        <rect x="132" y="300" width="46" height="82" rx="16" fill="#8a5a34" stroke="#5e3b1f" stroke-width="3"/>
        <rect x="182" y="300" width="46" height="82" rx="16" fill="#8a5a34" stroke="#5e3b1f" stroke-width="3"/>
        <path d="M144 340q10 6 22 0M194 340q10 6 22 0" stroke="#6b4528" stroke-width="2.500" fill="none" stroke-linecap="round"/>
        <ellipse cx="155" cy="388" rx="27" ry="9" fill="#33241c"/><ellipse cx="205" cy="388" rx="27" ry="9" fill="#33241c"/>
        <!-- 회갈색 체크 털 코트 -->
        <path d="M104 158C80 170 68 232 74 292L54 338Q180 304 306 338L286 292C292 232 280 170 256 158C230 148 130 148 104 158Z" fill="url(#plaid)" stroke="#51484f" stroke-width="3" stroke-linejoin="round"/>
        <!-- 코트 뒷깃 (깔끔한 스탠드 칼라) -->
        <path d="M122 156Q126 134 150 130H210Q234 134 238 156L226 168H134Z" fill="#6f656c" stroke="#51484f" stroke-width="3" stroke-linejoin="round"/>
        <!-- 이너: 머스터드 상의 + 검은 단추 -->
        <path d="M146 150L180 254L214 150Z" fill="#c98a2e"/>
        <path d="M180 160V254" stroke="#a46f1f" stroke-width="2"/>
        <circle cx="180" cy="178" r="4.200" fill="#17120f"/><circle cx="180" cy="200" r="4.200" fill="#17120f"/><circle cx="180" cy="222" r="4.200" fill="#17120f"/>
        <!-- 머리 (살짝 위를 올려다봄) -->
        <g id="charHead"><g transform="rotate(-6 180 150)">
          <rect x="164" y="128" width="32" height="30" rx="10" fill="#dcae8a"/>
          <path d="M160 152Q180 168 200 152" stroke="#a46f1f" stroke-width="3" fill="#c98a2e"/>
          <g transform="translate(30 4)">
            <ellipse cx="102" cy="98" rx="6" ry="9" fill="#e8b997"/><ellipse cx="198" cy="98" rx="6" ry="9" fill="#e8b997"/>
            <ellipse cx="150" cy="94" rx="49" ry="49" fill="#f7d4b4" stroke="#dcab88" stroke-width="2"/>
            <!-- 살짝 볶은 듯한 자연스러운 반곱슬: 앞머리 끝에 작은 S자 컬, 매트한 다크브라운 -->
            <path d="M96 100C86 70 92 46 110 34C120 26 132 27 142 23C154 19 168 26 180 26C198 30 208 52 205 74C207 86 205 94 204 100C200 88 198 82 195 80C190 90 185 92 180 85C177 80 171 82 170 88C168 95 161 94 157 86C153 79 147 83 145 90C143 97 135 95 133 87C131 80 123 82 121 89C119 95 111 93 109 86C106 92 102 96 96 100Z" fill="#3a2a24"/>
            <path d="M100 80C96 92 97 100 101 106C100 98 102 92 106 86ZM199 80C204 92 203 100 199 106C200 98 198 92 194 86Z" fill="#3a2a24"/>
            <path d="M104 60C112 50 120 52 126 46M132 40C140 34 150 38 156 32M164 36C174 32 184 36 190 44M110 74C118 66 126 70 134 64M150 66C160 60 168 66 178 62M184 62C192 60 198 66 200 72" fill="none" stroke="#54413a" stroke-width="2.200" stroke-linecap="round"/>
            <path d="M168 87c2 4 6 4 8 0M144 90c2 4 6 4 8-1M120 89c2 4 6 4 8-1" fill="none" stroke="#54413a" stroke-width="2" stroke-linecap="round"/>
            <!-- 동그란 선글라스 -->
            <circle cx="129" cy="100" r="16.500" fill="#0d0d12"/><circle cx="171" cy="100" r="16.500" fill="#0d0d12"/>
            <path d="M145 98q5-4 10 0M113 97L101 94M187 97L199 94" stroke="#0d0d12" stroke-width="3.500" fill="none" stroke-linecap="round"/>
            <ellipse cx="123" cy="94" rx="5" ry="3" fill="#fff" opacity=".5"/><ellipse cx="165" cy="94" rx="5" ry="3" fill="#fff" opacity=".5"/>
            <ellipse cx="110" cy="121" rx="8" ry="4.500" fill="#f58a9a" opacity=".5"/><ellipse cx="190" cy="121" rx="8" ry="4.500" fill="#f58a9a" opacity=".5"/>
            <path d="M150 105q-2 6 2 7" stroke="#d3a07e" stroke-width="2" fill="none" stroke-linecap="round"/>
            <!-- 치아가 보이지 않는 부드러운 미소 -->
            <path class="mouth" d="M137 123Q150 134 163 123" stroke="#c0626a" stroke-width="4.500" fill="none" stroke-linecap="round"/>
            <path class="mouth-joy" d="M132 121Q150 141 168 121" stroke="#c0626a" stroke-width="4.500" fill="none" stroke-linecap="round"/>
          </g>
        </g></g>
        <!-- 라펠 · 소매 · 모은 두 손 -->
        <path d="M128 150L162 254L140 270L104 192Z" fill="#6f656c" stroke="#51484f" stroke-width="3" stroke-linejoin="round"/>
        <path d="M232 150L198 254L220 270L256 192Z" fill="#6f656c" stroke="#51484f" stroke-width="3" stroke-linejoin="round"/>
        <path d="M104 168C70 215 82 275 148 282L166 258C128 252 124 218 140 184Z" fill="url(#plaid)" stroke="#51484f" stroke-width="3" stroke-linejoin="round"/>
        <path d="M256 168C290 215 278 275 212 282L194 258C232 252 236 218 220 184Z" fill="url(#plaid)" stroke="#51484f" stroke-width="3" stroke-linejoin="round"/>
        <g class="hands">
          <ellipse cx="180" cy="264" rx="26" ry="15" fill="#f7d4b4" stroke="#dcab88" stroke-width="2"/>
          <path d="M162 262h36M166 270h28M180 252v22" stroke="#dcab88" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>
    </svg>
  </div>

  <canvas id="fx"></canvas>

  <header id="hud">
  	<a href="https://www.jeehwany.com/games" class="game-nav-btn" aria-label="게임 목록으로 돌아가기" title="게임 목록">
	  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
	    <rect x="3" y="3" width="7" height="7" rx="1.5"/>
	    <rect x="14" y="3" width="7" height="7" rx="1.5"/>
	    <rect x="3" y="14" width="7" height="7" rx="1.5"/>
	    <rect x="14" y="14" width="7" height="7" rx="1.5"/>
	  </svg>
	</a>
    <div class="title"><span class="t">별들의 밤</span></div>
    <div class="box"><b id="hud-time">30</b></div>
    <div class="box right" id="hud-score-box"><b><span id="hud-score">0</span> / 50</b></div>
  </header>

  <button id="mute" type="button" aria-label="효과음 끄기" aria-pressed="false">🔊</button>

  <section id="start" class="panel">
    <div class="card">
      <h1>별들의 밤!</h1>
      <p class="desc">켄타우루스 축제!<br>30초 동안 떨어지는 별똥별 50개를 터치하세요</p>
      <button id="btn-start" class="btn" type="button">소원 빌러 가기</button>
    </div>
  </section>

  <div id="count" aria-live="assertive"></div>

  <section id="result" class="panel">
    <div class="card">
      <h2>별들의 밤!</h2>
      <p class="msg" id="r-msg">오늘 밤, 소원 0개를 빌었어요!</p>
      <p class="big"><span id="r-score">0</span> / 50</p>
      <!-- <p class="best">BEST <span id="r-best">0</span> <em id="r-new" hidden>🌟 NEW</em></p> -->
      <button id="btn-retry" class="btn" type="button">다시 소원 빌기</button>
    </div>
  </section>
</main>
<script src="star.js"></script>
</body>
</html>
