<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>오렌지 쌓기</title>
<link rel="stylesheet" href="stack.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><radialGradient id="og" cx="35%" cy="30%" r="75%">
    <stop offset="0" stop-color="#ffb347"/><stop offset=".55" stop-color="#ff8c1a"/><stop offset="1" stop-color="#e2600a"/>
  </radialGradient></defs>
  <symbol id="m1" viewBox="0 0 100 110">
    <circle cx="50" cy="62" r="42" fill="url(#og)"/>
    <ellipse cx="50" cy="21" rx="4.5" ry="3" fill="#7a4a1e"/>
    <ellipse cx="34" cy="44" rx="9" ry="5" transform="rotate(-40 34 44)" fill="#fff" opacity=".35"/>
    <circle cx="37" cy="60" r="4.5" fill="#5a3010"/><circle cx="63" cy="60" r="4.5" fill="#5a3010"/>
    <ellipse cx="28" cy="70" rx="6" ry="4" fill="#ff8a8a" opacity=".6"/><ellipse cx="72" cy="70" rx="6" ry="4" fill="#ff8a8a" opacity=".6"/>
    <path d="M42 70Q50 79 58 70" stroke="#5a3010" stroke-width="3" fill="none" stroke-linecap="round"/>
  </symbol>
  <symbol id="m2" viewBox="0 0 100 110">
    <circle cx="50" cy="62" r="42" fill="url(#og)"/>
    <ellipse cx="50" cy="21" rx="4.5" ry="3" fill="#7a4a1e"/>
    <circle cx="36" cy="56" r="8" fill="#fff"/><circle cx="64" cy="56" r="8" fill="#fff"/>
    <circle cx="36" cy="58" r="3.5" fill="#5a3010"/><circle cx="64" cy="58" r="3.5" fill="#5a3010"/>
    <path d="M26 44L44 49M74 44L56 49" stroke="#5a3010" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="50" cy="78" rx="8" ry="6" fill="#7a2a0a"/>
    <path d="M84 38q4 7 0 10q-4-3 0-10Z" fill="#8fd3ff"/>
  </symbol>
</svg>

<div id="game">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="title"><span>🍊</span><span class="t"> 오렌지 쌓기</span></div>
    <div class="stats">
      <div class="stat score"><span>SCORE</span><b id="score">1</b></div>
      <i class="sep"></i>
      <div class="stat best"><span>BEST</span><b id="best">0</b></div>
    </div>
    <div class="side">
      <button id="sound" type="button" aria-label="소리 켜기/끄기" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/>
          <g class="waves"><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></g>
          <g class="mute"><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></g>
        </svg>
      </button>
    </div>
  </div>
  <div id="hint">클릭 · 터치 · 스페이스바로 떨어뜨리기</div>

  <div id="start" class="overlay top">
    <div class="bubble">오렌지로도 연습할 수 있대</div>
    <svg class="mascot"><use href="#m1"/></svg>
    <p>오렌지를 떨어뜨려 높이 쌓아보세요.</p>
    <p>균형을 잃고 무너지면 게임 오버!</p>
    <button id="startBtn">시작하기</button>
  </div>

  <div id="over" class="overlay hidden">
    <div id="newRec" class="badge hidden">NEW RECORD!</div>
    <h2>GAME OVER</h2>
    <div class="bubble sad">야! 뭐해?</div>
    <svg class="mascot shake"><use href="#m2"/></svg>
    <div class="res">
      <div><span>이번에 쌓은 오렌지</span><b id="overScore">0</b></div>
      <div><span>최고 기록</span><b id="overBest">0</b></div>
    </div>
    <button id="retryBtn">다시 하기</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="stack.js"></script>
</body>
</html>
